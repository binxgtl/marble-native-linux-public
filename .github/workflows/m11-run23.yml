name: M11 Run23 R2 ION-ownership diagnostic (offline + binaries)
# Run23 (scripts/m11/run23/SPEC.md): Run22's one GPR GET_SPF_STATE on a never-mapped boot behind
# the Disable-only amplifier gate, plus R2 (PID1 owns /dev/msm_audio_ion with a two-pair seal; no
# ION ioctl) and journal stamps at journal.sh's clock; NOT an audio PASS. Offline suites on x64
# and native ARM64, the Windows receiver, and the two on-device binaries (static ARM64 runner with
# native gcc, freestanding relay with the pinned clang-r416183b), each built twice and compared.
# No device, driver, firmware, ROM payload or proprietary module is used or uploaded.
on:
  workflow_dispatch:
  push:
    branches: [m11/r2-ion-ownership]
    paths:
      - 'scripts/m11/run23/**'
      - 'scripts/m11/anchor-native/**'
      - 'scripts/m11/qualification/ownership/**'
      - 'scripts/m11/runtime/**'
      - '.github/workflows/m11-run23.yml'
permissions:
  contents: read
  actions: read
jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang busybox
          gcc --version | head -1; clang --version | head -1; busybox | head -1; uname -m
      - name: Run23 runner suite
        run: bash scripts/m11/run23/test.sh artifacts/m11/run23/runner
      - name: Run23 transport suite
        if: always()
        run: |
          (cd scripts/m11/instrumentation && python3 test-evidence.py)
          bash scripts/m11/run23/test-transport.sh artifacts/m11/run23/transport
      - name: Integrated anchor suite (stand-in GET_SPF_STATE, census, worker confinement)
        if: always()
        run: bash scripts/m11/anchor-native/test.sh artifacts/m11/run23/anchor-native
      - name: Anchor qualification suite
        if: always()
        run: bash scripts/m11/qualification/ownership/run_anchor_tests.sh artifacts/m11/run23/anchor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run23-suites-${{ runner.arch }}-${{ github.sha }}
          path: |
            artifacts/m11/run23/**/*.log
            artifacts/m11/run23/**/*.txt
            artifacts/m11/run23/**/*.sha256
            artifacts/m11/run23/transport/*.bin
  windows-receiver:
    needs: suites
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: run23-suites-ARM64-${{ github.sha }}
          path: artifacts/m11/run23
      - name: Continuous receiver and launcher plan (no phone tool)
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/m11/run23/test-host-reader.ps1 -Fixture artifacts/m11/run23/transport/capture.bin
          $env:M11_PWSH='pwsh'; python scripts/m11/run23/test-launch.py
  build-runner:
    needs: suites
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Static ARM64 runner, A/B identical, refuses outside PID1
        run: bash scripts/m11/run23/build.sh runner artifacts/m11/run23-build
      - uses: actions/upload-artifact@v4
        with:
          name: run23-runner-${{ github.sha }}
          path: |
            artifacts/m11/run23-build/m11-run23
            artifacts/m11/run23-build/runner-elf.txt
            artifacts/m11/run23-build/runner-compiler.txt
            artifacts/m11/run23-build/SHA256SUMS-runner
  build-relay:
    needs: suites
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Freestanding relay with the pinned clang-r416183b, A/B identical
        run: bash scripts/m11/run23/build.sh relay artifacts/m11/run23-build
      - uses: actions/upload-artifact@v4
        with:
          name: run23-relay-${{ github.sha }}
          path: |
            artifacts/m11/run23-build/m11-kmsg-relay
            artifacts/m11/run23-build/relay-compiler.txt
            artifacts/m11/run23-build/relay-toolchain-commit.txt
            artifacts/m11/run23-build/SHA256SUMS-relay
  native-arm64-elf:
    needs: build-relay
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: run23-relay-${{ github.sha }}
          path: artifacts/m11/run23-build
      - name: Exact relay ELF over a private PTY (Run23 paths, runner journal)
        run: |
          cd artifacts/m11/run23-build && sha256sum -c SHA256SUMS-relay && cd -
          chmod 0755 artifacts/m11/run23-build/m11-kmsg-relay
          sudo python3 scripts/m11/run23/test-elf.py artifacts/m11/run23-build/m11-kmsg-relay --out artifacts/m11/run23-elf/elf-pty.bin
      - uses: actions/upload-artifact@v4
        with:
          name: run23-relay-elf-${{ github.sha }}
          path: artifacts/m11/run23-elf
