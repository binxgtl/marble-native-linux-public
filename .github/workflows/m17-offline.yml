name: M17 dual-boot selector offline
on:
  push:
    branches: [m17/dual-boot-selector]
    paths: ['scripts/m17/**', '.github/workflows/m17-offline.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m17-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: M17 selector core (G1), K1-keys (G3) and the selector (G4) on synthetic trees, normal and ASan/UBSan, then static binaries twice (no device)
        timeout-minutes: 10
        run: bash scripts/m17/test.sh artifacts/m17/${{ runner.arch }}
      - name: Upload the reviewable static binaries (ARM64 only, no boot image)
        if: runner.arch == 'ARM64'
        uses: actions/upload-artifact@v4
        with:
          name: m17-native-ARM64-${{ github.sha }}
          path: |
            artifacts/m17/ARM64/m17-pid-g3-a
            artifacts/m17/ARM64/m17-pid-g3-b
            artifacts/m17/ARM64/m17-keys-a
            artifacts/m17/ARM64/m17-keys-b
            artifacts/m17/ARM64/m17-selector-a
            artifacts/m17/ARM64/m17-selector-b
            artifacts/m17/ARM64/m17-binaries.txt
          if-no-files-found: error
          retention-days: 30
  mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Mutants of the M17 selector core, K1-keys and the selector (no device)
        timeout-minutes: 25
        run: python3 scripts/m17/mutate.py
