name: M19 native Ubuntu FBE offline
on:
  push:
    branches: [m19/native-ubuntu-fbe]
    paths: ['scripts/m19/**', '.github/workflows/m19-offline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Gates, plans and parsers on synthetic inputs (no device)
        run: python3 scripts/m19/test.py
      - name: Bionic client against frozen Keystore2 AIDL (no device)
        if: runner.arch == 'X64'
        run: bash scripts/m19/unlock/build-ndk.sh artifacts/m19/ndk
      - name: Actual binding and one-shot probe on typed fakes, read-only fixtures and deadlines (no Binder or TEE)
        run: bash scripts/m19/unlock/test-probe.sh artifacts/m19/${{ runner.arch }}/probe-tests
      - name: Mutants of the safety gates (no device)
        run: python3 scripts/m19/mutate.py
      - name: Unlock core and ramdisk extractor, normal and ASan/UBSan, mutants, static binary (no device)
        run: bash scripts/m19/unlock/test.sh artifacts/m19/${{ runner.arch }}
      - name: R1 PID 1 and T scripts on synthetic trees, normal and ASan/UBSan, static binaries (no device)
        run: bash scripts/m19/run1/test.sh artifacts/m19/${{ runner.arch }}/run1
        env:
          M19_MUTANTS: '0'
      - name: R2 and R3 hand-off, reporter, T9 and desktop checks on synthetic trees, normal and ASan/UBSan, static PID 1 (no device)
        run: bash scripts/m19/run2/test.sh artifacts/m19/${{ runner.arch }}/run2
        env:
          M19_MUTANTS: '0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m19-native-${{ runner.arch }}-${{ github.sha }}
          path: |
            artifacts/m19/**/m19-rdx-a
            artifacts/m19/**/m19-unlock-a
            artifacts/m19/**/m19-probe-a
            artifacts/m19/**/m19-probe-b
            artifacts/m19/**/pid1-a
            artifacts/m19/**/pid1-b
            artifacts/m19/**/pid2-a
            artifacts/m19/**/pid2-b
            artifacts/m19/**/pid3-a
            artifacts/m19/**/pid3-b
            artifacts/m19/**/xorg-shim-a.so
            artifacts/m19/**/xorg-shim-b.so
            artifacts/m19/**/load-heaps-a
            artifacts/m19/**/load-heaps-b
            artifacts/m19/**/*.txt
  mutants:
    # The slow mutation checks of R1 and R2/R3, once each and in parallel with the regression jobs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: run1
            script: scripts/m19/run1/mutate.py
          - suite: run2
            script: scripts/m19/run2/mutate.py
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Mutants of ${{ matrix.suite }} (no device)
        run: python3 ${{ matrix.script }}
