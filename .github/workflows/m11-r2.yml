name: M11 R2 offline (journal stamp fix, anchor-native suites, custodian and runtime-repair suites, graph plan, P4 and P5 binaries)
# Offline only, on x64 and native ARM64: the integrated anchor suite (runner control flow, PDR
# model, census, stand-in GET_SPF_STATE, the Run22 journal-stamp fix through the real journal.sh
# with BusyBox and the unmodified evidence rule, mutants), the anchor qualification suite, the
# custodian and runtime-repair suites (post-MAP hold) and the synthetic AudioReach graph-plan
# parser tests.
# No candidate, no device, driver, firmware, ROM payload or proprietary module.
on:
  workflow_dispatch:
  push:
    branches: [m11/r2-ion-ownership]
    paths:
      - 'scripts/m11/anchor-native/**'
      - 'scripts/m11/qualification/ownership/**'
      - 'scripts/m11/qualification/runtime-repair/**'
      - 'scripts/m11/instrumentation/**'
      - 'scripts/m11/runtime/**'
      - 'scripts/m11/r2/**'
      - '.github/workflows/m11-r2.yml'
permissions:
  contents: read
jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang busybox
          gcc --version | head -1; clang --version | head -1; busybox | head -1; uname -m
      - name: Evidence rule tests
        run: (cd scripts/m11/instrumentation && python3 test-evidence.py)
      - name: Integrated anchor suite (incl. journal stamp end to end)
        if: always()
        run: bash scripts/m11/anchor-native/test.sh artifacts/m11/r2/anchor-native
      - name: Anchor qualification suite
        if: always()
        run: bash scripts/m11/qualification/ownership/run_anchor_tests.sh artifacts/m11/r2/anchor
      - name: AudioReach graph-plan parser (synthetic ACDB/XML only)
        if: always()
        run: |
          mkdir -p artifacts/m11/r2/graph-plan
          (cd scripts/m11/r2 && python3 test_graph_plan.py -v) 2>&1 | tee artifacts/m11/r2/graph-plan/test.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Speaker session plan generator (synthetic ACDB/XML/calibration only)
        if: always()
        run: |
          mkdir -p artifacts/m11/r2/speaker-plan
          python3 -I scripts/m11/r2/test_speaker_plan.py -v 2>&1 | tee artifacts/m11/r2/speaker-plan/test.log
          test "${PIPESTATUS[0]}" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2-suites-${{ runner.arch }}-${{ github.sha }}
          path: |
            artifacts/m11/r2/**/*.log
            artifacts/m11/r2/**/*.txt
            artifacts/m11/r2/**/*.sha256
  # CP2 criterion 5, post-MAP hold (docs/m11-argon-cp2-c5-hold-design.md): the offline custodian
  # suite (taint/ACK/graph ledger, before/after witnesses on pinned baselines, adversarial matrices,
  # seeded fuzz with rule mutants, W3 cmdline differential) and the runtime-repair suite (repaired,
  # hardening and fuzz suites, Python oracle, review and hardening baselines, mutation check).
  # Mocks only; no device, firmware or proprietary input.
  custodian:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang
          gcc --version | head -1; clang --version | head -1; uname -m
      - name: Pinned ACK reference sources for W3 (sha256-checked, not committed)
        run: bash scripts/m11/qualification/ownership/fetch_ack_ref_sources.sh "$RUNNER_TEMP/ack"
      - name: Offline custodian suite (post-MAP hold)
        env:
          M11_ACK_SRC: ${{ runner.temp }}/ack
        run: bash scripts/m11/qualification/ownership/run_tests.sh artifacts/m11/r2/custodian
      - name: Runtime-repair suite (post-MAP hold, baselines, mutation check)
        if: always()
        run: bash scripts/m11/qualification/runtime-repair/run_tests.sh artifacts/m11/r2/runtime-repair
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2-custodian-${{ runner.arch }}-${{ github.sha }}
          path: |
            artifacts/m11/r2/**/*.log
            artifacts/m11/r2/**/*.txt
            artifacts/m11/r2/**/*.sha256
  # P4 item 5 (docs/m11-argon-p4-assembly.md): the candidate's two on-device binaries, each built
  # twice and compared, on the Run23 build pattern. Not a candidate by themselves: the local staging
  # takes them from these artifacts by digest. No device, ROM payload or proprietary module.
  p4-build-pid1:
    needs: suites
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Static ARM64 native custodian PID1, A/B identical, refuses outside PID1
        run: bash scripts/m11/anchor-native/p4/build.sh pid1 artifacts/m11/p4-build
      - uses: actions/upload-artifact@v4
        with:
          name: p4-pid1-${{ github.sha }}
          path: |
            artifacts/m11/p4-build/m11-p4
            artifacts/m11/p4-build/pid1-elf.txt
            artifacts/m11/p4-build/pid1-compiler.txt
            artifacts/m11/p4-build/SHA256SUMS-pid1
  p4-build-relay:
    needs: suites
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Freestanding M11R25 relay with the pinned clang-r416183b, A/B identical
        run: bash scripts/m11/anchor-native/p4/build.sh relay artifacts/m11/p4-build
      - uses: actions/upload-artifact@v4
        with:
          name: p4-relay-${{ github.sha }}
          path: |
            artifacts/m11/p4-build/m11-kmsg-relay
            artifacts/m11/p4-build/relay-compiler.txt
            artifacts/m11/p4-build/relay-toolchain-commit.txt
            artifacts/m11/p4-build/SHA256SUMS-relay
  p4-relay-elf:
    needs: p4-build-relay
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p4-relay-${{ github.sha }}
          path: artifacts/m11/p4-build
      - name: Exact M11R25 relay ELF over a private PTY, decoded by the P4 host check
        run: |
          cd artifacts/m11/p4-build && sha256sum -c SHA256SUMS-relay && cd -
          chmod 0755 artifacts/m11/p4-build/m11-kmsg-relay
          sudo python3 scripts/m11/anchor-native/p4/test-elf.py artifacts/m11/p4-build/m11-kmsg-relay --out artifacts/m11/p4-elf/elf-pty.bin
      - uses: actions/upload-artifact@v4
        with:
          name: p4-relay-elf-${{ github.sha }}
          path: artifacts/m11/p4-elf
  # Run25 readiness R2: the P4 host side on Windows (the Run23 receiver over a synthetic P4 capture,
  # the M11R25 observer identity, the launcher's PlanOnly branch). No phone tool, no COM port opened.
  p4-windows-host:
    needs: suites
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Receiver, observer identity, launcher plan and post-run listing (no phone tool)
        shell: pwsh
        run: |
          python scripts/m11/anchor-native/p4/test-p4-check.py --write-fixture p4-fixture.bin
          if ($LASTEXITCODE -ne 0) { exit 1 }
          pwsh -NoProfile -File scripts/m11/anchor-native/p4/test-host-reader.ps1 -Fixture p4-fixture.bin
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:M11_PWSH='pwsh'; python scripts/m11/anchor-native/p4/test-launch.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/m11/anchor-native/p4/test-post-run-listing.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
  # P5 W6 (docs/m11-argon-speaker-run-design.md): the speaker candidate's two on-device binaries, each built
  # twice and compared, on the P4 build pattern. Not a candidate by themselves: the local staging takes them
  # from these artifacts by digest. No device, ROM payload, ACDB or proprietary module.
  p5-build-pid1:
    needs: suites
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Static ARM64 speaker PID1, A/B identical, refuses outside PID1
        run: bash scripts/m11/anchor-native/p5/build.sh pid1 artifacts/m11/p5-build
      - uses: actions/upload-artifact@v4
        with:
          name: p5-pid1-${{ github.sha }}
          path: |
            artifacts/m11/p5-build/m11-p5
            artifacts/m11/p5-build/pid1-elf.txt
            artifacts/m11/p5-build/pid1-compiler.txt
            artifacts/m11/p5-build/SHA256SUMS-pid1
  p5-build-relay:
    needs: suites
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Freestanding M11R27 relay with the pinned clang-r416183b, A/B identical
        run: bash scripts/m11/anchor-native/p5/build.sh relay artifacts/m11/p5-build
      - uses: actions/upload-artifact@v4
        with:
          name: p5-relay-${{ github.sha }}
          path: |
            artifacts/m11/p5-build/m11-kmsg-relay
            artifacts/m11/p5-build/relay-compiler.txt
            artifacts/m11/p5-build/relay-toolchain-commit.txt
            artifacts/m11/p5-build/SHA256SUMS-relay
  p5-relay-elf:
    needs: p5-build-relay
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p5-relay-${{ github.sha }}
          path: artifacts/m11/p5-build
      - name: Exact M11R27 relay ELF over a private PTY, decoded by the P5 host check
        run: |
          cd artifacts/m11/p5-build && sha256sum -c SHA256SUMS-relay && cd -
          chmod 0755 artifacts/m11/p5-build/m11-kmsg-relay
          sudo python3 scripts/m11/anchor-native/p5/test-elf.py artifacts/m11/p5-build/m11-kmsg-relay --out artifacts/m11/p5-elf/elf-pty.bin
      - uses: actions/upload-artifact@v4
        with:
          name: p5-relay-elf-${{ github.sha }}
          path: artifacts/m11/p5-elf
  # The P5 host side on Windows (the receiver over a synthetic P5 capture, the M11R27 observer identity, the
  # launcher's PlanOnly branch, the post-run listing). No phone tool, no COM port opened.
  p5-windows-host:
    needs: suites
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Receiver, observer identity, launcher plan and post-run listing (no phone tool)
        shell: pwsh
        run: |
          python scripts/m11/anchor-native/p5/test-p5-check.py --write-fixture p5-fixture.bin
          if ($LASTEXITCODE -ne 0) { exit 1 }
          pwsh -NoProfile -File scripts/m11/anchor-native/p5/test-host-reader.ps1 -Fixture p5-fixture.bin
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:M11_PWSH='pwsh'; python scripts/m11/anchor-native/p5/test-launch.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/m11/anchor-native/p5/test-post-run-listing.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
