name: M15 charging observations offline
on:
  push:
    branches: [m15/charging-pd]
    paths: ['scripts/m15/**', '.github/workflows/m15-observe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic sysfs, real supervision, short I/O and ASan/UBSan
        run: bash scripts/m15/test.sh artifacts/m15/${{ runner.arch }}
      - name: O1 compatibility and O2 vendor-partner/comparison negative tests
        run: bash scripts/m15/phaseb/test.sh artifacts/m15/${{ runner.arch }}
      - name: Offline topology manifests and end-to-end comparison fixture CLI
        run: |
          set -euo pipefail
          python3 scripts/m15/phaseb/topology/test.py -v 2>&1 | tee artifacts/m15/${{ runner.arch }}/topology-tests.txt
          python3 scripts/m15/phaseb/compare.py \
            --android-capture scripts/m15/phaseb/topology/fixtures/android.synthetic.jsonl \
            --native-capture scripts/m15/phaseb/topology/fixtures/native.synthetic.jsonl \
            --android-context scripts/m15/phaseb/topology/fixtures/android.context.synthetic.json \
            --native-context scripts/m15/phaseb/topology/fixtures/native.context.synthetic.json \
            > artifacts/m15/${{ runner.arch }}/comparison-synthetic.json
      - name: Reproducible static observer (no hardware candidate)
        run: |
          set -euo pipefail
          out=artifacts/m15/${{ runner.arch }}
          for n in a b; do
            gcc -std=c11 -O2 -Wall -Wextra -Werror -static -Wl,--build-id=none scripts/m15/observe.c -o "$out/m15-observe-$n"
          done
          cmp "$out/m15-observe-a" "$out/m15-observe-b"
          sha256sum "$out/m15-observe-a" > "$out/binary-sha256.txt"
          for n in a b; do
            gcc -std=c11 -O2 -Wall -Wextra -Werror -static -Wl,--build-id=none scripts/m15/phaseb/observe.c -o "$out/m15-observe-o2-$n"
          done
          cmp "$out/m15-observe-o2-a" "$out/m15-observe-o2-b"
          sha256sum "$out/m15-observe-o2-a" > "$out/o2-binary-sha256.txt"
      - name: Versioned USB_PD contract and exploratory-data non-promotion
        run: bash scripts/m15/o3/test.sh artifacts/m15/${{ runner.arch }}
      - name: Reproducible static O3 observer (offline only)
        run: |
          set -euo pipefail
          out=artifacts/m15/${{ runner.arch }}
          for n in a b; do
            gcc -std=c11 -O2 -Wall -Wextra -Werror -static -Wl,--build-id=none scripts/m15/o3/observe.c -o "$out/m15-observe-o3-$n"
          done
          cmp "$out/m15-observe-o3-a" "$out/m15-observe-o3-b"
          sha256sum "$out/m15-observe-o3-a" > "$out/o3-binary-sha256.txt"
      - name: Versioned O3 context and comparison integration, offline fixtures
        run: |
          set -euo pipefail
          python3 scripts/m15/o3_integration/verify-legacy.py | tee artifacts/m15/${{ runner.arch }}/o3-integration-legacy.txt
          python3 scripts/m15/o3_integration/test.py -v 2>&1 | tee artifacts/m15/${{ runner.arch }}/o3-integration-tests.txt
          python3 scripts/m15/o3_integration/compare_v3.py \
            --android-capture scripts/m15/o3_integration/fixtures/android.synthetic.jsonl \
            --native-capture scripts/m15/o3_integration/fixtures/native.synthetic.jsonl \
            --android-context scripts/m15/o3_integration/fixtures/android.context.synthetic.json \
            --native-context scripts/m15/o3_integration/fixtures/native.context.synthetic.json \
            > artifacts/m15/${{ runner.arch }}/comparison-o3-synthetic.json
      - name: Termux RAM workflow offline qualification (no Android device)
        run: |
          set -euo pipefail
          sh -n scripts/m15/termux/capture.sh
          findmnt -n -o OPTIONS /dev | tee artifacts/m15/${{ runner.arch }}/termux-host-dev-mount.txt
          for variant in normal sanitize; do
            binary=artifacts/m15/${{ runner.arch }}/m15-observe-o3-a
            if [ "$variant" = sanitize ]; then binary=artifacts/m15/${{ runner.arch }}/observe-o3-sanitize; fi
            sudo -E python3 scripts/m15/termux/test.py --binary "$binary" -v 2>&1 | tee artifacts/m15/${{ runner.arch }}/termux-$variant.txt
          done
      - name: Native Phase1 RAM escrow, real subreaper, independent host (offline)
        run: bash scripts/m15/native1/test.sh artifacts/m15/${{ runner.arch }}
      - name: Native Phase3 custodian IPC and saved-file ACK integration (offline)
        run: bash scripts/m15/native3/test.sh artifacts/m15/${{ runner.arch }}
      - name: Phase4 actual namespace PID1 ownership (offline)
        run: bash scripts/m15/native4/test.sh artifacts/m15/${{ runner.arch }}
      - name: Native preparation color admissions and I/O errors (offline)
        run: bash scripts/m15/native5/test.sh artifacts/m15/${{ runner.arch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m15-observe-${{ runner.arch }}-${{ github.sha }}
          path: artifacts/m15/${{ runner.arch }}/
  windows-receiver:
    needs: regression
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: m15-observe-X64-${{ github.sha }}
          path: fixture
      - name: Offline CSharp receiver and independent Python saved-file replay
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSVersionTable | Out-File runtime.txt
          python --version >> runtime.txt
          ./scripts/m15/native4/test-receiver.ps1 -Wire fixture/native1-normal/native1-synthetic.wire -Out artifacts/m15/windows | Tee-Object receiver-tests.txt
      - name: COM completion/cancellation ownership fault injection (no COM open)
        shell: pwsh
        run: ./scripts/m15/native4/test-com.ps1 -Out artifacts/m15/windows/com-tests.json
      - name: Win32 binding over injected API (no COM open)
        shell: pwsh
        run: ./scripts/m15/native5/test-win32.ps1 -Out artifacts/m15/windows/win32-tests.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m15-native4-windows-${{ github.sha }}
          path: |
            artifacts/m15/windows/
            receiver-tests.txt
            runtime.txt
